<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Omställningsplatser</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Omställning" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="root"></div>
  <noscript>Appen behöver JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    // Om appen inte startar alls (t.ex. ingen uppkoppling) visas en knapp i stället för en vit sida.
    setTimeout(function () {
      var r = document.getElementById('root');
      if (r && !r.firstChild) r.innerHTML = '<div style="padding:48px 24px;text-align:center;font:16px -apple-system,sans-serif">'
        + '<p>Appen kunde inte starta. Kolla uppkopplingen.</p><button onclick="location.reload()" style="font:inherit;padding:10px 18px;border-radius:10px;border:0;background:#2f6b4f;color:#fff">Ladda om</button></div>';
    }, 12000);
  </script>
</body>
</html>
